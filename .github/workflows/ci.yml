name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Typecheck and build resolve every DSH type from the published
      # devDependencies, so they no longer need a sibling deepseek-harness
      # checkout and therefore always run here. They used to be gated on that
      # sibling being present, which let CI go green while the local build was
      # broken.
      - run: pnpm run check
